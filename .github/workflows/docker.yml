name: Docker image

# Builds the image and publishes it to GitHub Container Registry:
#   ghcr.io/web-usov/kopeika:latest      — every push to main
#   ghcr.io/web-usov/kopeika:sha-abc1234 — every build, for rollbacks
#   ghcr.io/web-usov/kopeika:1.2.3       — git tags like v1.2.3
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Full history with tags: the app version comes from `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Override what the action derives from the ref (it would say "main" or "pr-12").
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}

      # Smoke test: the image must start and answer before it is published.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: kopeika:ci
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.sha }}
          cache-from: type=gha

      - name: Smoke test image
        run: |
          docker run -d --name kopeika-ci -e DEV_AUTH=1 -e BOT_POLLING=0 -p 3000:3000 kopeika:ci
          fail() {
            echo "::error::$1"
            docker logs kopeika-ci
            exit 1
          }
          ok=0
          for _ in $(seq 1 30); do
            if [ "$(curl -fs localhost:3000/healthz)" = "ok" ]; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || fail "/healthz did not return ok within 30s"
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)
          [ "$code" = 200 ] || fail "GET / returned $code, expected 200"
          body=$(curl -fs localhost:3000/version) || fail "GET /version failed"
          echo "GET /version: $body"
          echo "Image label version: $(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' kopeika:ci)"
          case "$body" in
            *'"version":""'*|*'"version":"dev"'*) fail "/version is empty or dev: $body" ;;
          esac
          docker logs kopeika-ci 2>&1 | grep "listening"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/groups \
            -H 'Authorization: dev 1' -H 'Content-Type: application/json' \
            -d '{"name":"CI","currency":"RUB"}')
          [ "$code" = 201 ] || fail "POST /api/groups returned $code, expected 201"
          echo "Smoke test passed"
          docker rm -f kopeika-ci

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
