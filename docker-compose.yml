services:
  kopeika:
    # Built by GitHub Actions on every push to main (.github/workflows/docker.yml).
    # Pin a specific build for rollbacks, e.g. ghcr.io/web-usov/kopeika:sha-851b521
    image: ghcr.io/web-usov/kopeika:latest
    container_name: kopeika
    restart: unless-stopped
    # Every variable of the env file goes into the container (ADMIN_USER_IDS, RECEIPTS_*, limits, ...):
    # .env next to this file (docker compose) or stack.env (Portainer's Environment variables of the stack).
    # Either file may be missing; if both exist, stack.env wins.
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    # The same values are also used for ${...} below. Entries here override env_file.
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      APP_URL: ${APP_URL:-https://kopeika.usov-home.ru}
      APP_SHORT_NAME: ${APP_SHORT_NAME:-}
    volumes:
      - kopeika-data:/data
    # The app listens on port 3000 inside the container. Put it behind your reverse proxy (Traefik)
    # for https://kopeika.usov-home.ru, e.g. by adding Traefik labels and its network here.

volumes:
  kopeika-data:
